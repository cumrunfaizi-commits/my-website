

<!DOCTYPE html>    <!-- خب اینم صفحه ثبت نام ما -->

<html lang="fa" dir="rtl">

<head>

    <!-- بخش هد یا کله سایت -->

    <meta charset="UTF-8">   <!-- برای اینکه فارسی رو درست نشون بده -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت نام</title>

    <link rel="stylesheet" href="register.css">  <!-- وصل کردن فایل css -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>


<body class="register-page">


    <!-- بخش اصلی صفحه ثبت نام -->

    <main class="register-container">

        <section class="register-card">

            <header class="register-header">

                <h1>ایجاد حساب کاربری</h1>

                <p>به خانواده ما خوش آمدید!</p>

            </header>


            <!-- ثبت نام با گوگل و اپل -->

            <div class="social-register">

                <button type="button" class="google-register">
                    <span>G</span>
                    ثبت نام با حساب گوگل
                </button>

                <button type="button" class="apple-register">
                    <span></span>
                    ثبت نام با Apple ID
                </button>

            </div>


            <div class="register-divider">
                <span>یا ثبت نام با ایمیل</span>
            </div>


            <!-- اینجا فرم ثبت نام شروع میشه -->

            <form class="register-form" id="registerForm">

                <div class="form-section">

                    <h2>اطلاعات شخصی</h2>

                    <div class="form-grid">

                        <div class="input-group">
                            <label for="firstName">نام</label>
                            <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                placeholder="نام خود را وارد کنید"
                                autocomplete="given-name"
                                required>
                        </div>

                        <div class="input-group">
                            <label for="lastName">نام خانوادگی</label>
                            <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                placeholder="نام خانوادگی خود را وارد کنید"
                                autocomplete="family-name"
                                required>
                        </div>

                        <div class="input-group">
                            <label for="birthDate">تاریخ تولد</label>
                            <input
                                type="date"
                                id="birthDate"
                                name="birthDate">
                        </div>

                        <div class="input-group">
                            <label for="country">کشور</label>
                            <input
                                type="text"
                                id="country"
                                name="country"
                                placeholder="کشور محل سکونت">
                        </div>

                        <div class="input-group">
                            <label for="city">شهر</label>
                            <input
                                type="text"
                                id="city"
                                name="city"
                                placeholder="شهر محل سکونت">
                        </div>

                    </div>

                </div>


                <!-- بخش اطلاعات حساب کاربری -->

                <div class="form-section">

                    <h2>اطلاعات حساب کاربری</h2>

                    <div class="form-grid">

                        <div class="input-group">
                            <label for="username">نام کاربری</label>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="نام کاربری دلخواه"
                                autocomplete="username"
                                required>
                        </div>

                        <div class="input-group">
                            <label for="email">آدرس ایمیل</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="example@email.com"
                                autocomplete="email"
                                required>
                        </div>

                        <div class="input-group">
                            <label for="phone">شماره موبایل</label>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="09123456789"
                                autocomplete="tel"
                                inputmode="tel"
                                required>
                        </div>

                        <div class="input-group">
                            <label for="password">رمز عبور</label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="رمز عبور خود را وارد کنید"
                                    autocomplete="new-password"
                                    required>

                                <!-- دکمه نمایش رمز عبور -->

                                <button
                                    type="button"
                                    class="toggle-password"
                                    data-target="password"
                                    aria-label="نمایش رمز عبور">
                                    نمایش
                                </button>

                            </div>

                            <!-- میزان قوی بودن رمز عبور -->

                            <div class="password-strength">
                                <span class="strength-bar"></span>
                                <small class="strength-text">قدرت رمز عبور</small>
                            </div>

                        </div>

                        <div class="input-group">
                            <label for="confirmPassword">تکرار رمز عبور</label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="رمز عبور را مجدداً وارد کنید"
                                    autocomplete="new-password"
                                    required>

                                <!-- اینم دکمه نمایش رمز تکرار شده -->

                                <button
                                    type="button"
                                    class="toggle-password"
                                    data-target="confirmPassword"
                                    aria-label="نمایش رمز عبور">
                                    نمایش
                                </button>

                            </div>

                            <small class="password-match"></small>

                        </div>

                    </div>

                </div>


                <!-- قوانین و مقررات سایت -->

                <div class="register-terms">

                    <label>
                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required>

                        <span>
                            با
                            <a href="#" target="_blank">قوانین و مقررات</a>
                            و
                            <a href="#" target="_blank">حریم خصوصی</a>
                            موافقم.
                        </span>
                    </label>

                </div>


                <!-- دکمه ساخت حساب کاربری -->

                <button type="submit" class="register-submit">
                    ایجاد حساب کاربری
                </button>


                <!-- اگر قبلا حساب داشتیم از اینجا وارد میشیم -->

                <div class="login-link">

                    <span>قبلاً حساب کاربری ساخته‌اید؟</span>

                    <a href="../login/index.html">وارد شوید</a>

                </div>

            </form>

        </section>

    </main>

<!-- وصل کردن فایل جاوا اسکریپت به صفحه -->
<script src="register.js"></script>

</body>
</html>
